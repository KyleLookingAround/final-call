name: Balance

# The bot plays 1,150 game hours on three seeds and compares when it reaches each level with
# tools/baseline.json, once keeping the Classic layout and once rebuilding into better layouts
# (which should reach level 9 about 5-10% sooner). Runs on PRs that change the game or the bot, and on demand.
on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'tools/bot.js'
      - 'tools/run-bot.mjs'
      - 'tools/baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
        layouts: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # the table lands in the run's summary, and a level far off its baseline becomes a warning
      - run: npm run bot -- 1150 '{"layouts":${{ matrix.layouts }}}' --seed ${{ matrix.seed }}
