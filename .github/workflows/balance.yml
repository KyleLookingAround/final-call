name: Balance

# The bot plays 1,150 game hours on three seeds and compares when it reaches each level with
# tools/baseline.json, once keeping the Classic layout and once rebuilding into better layouts
# (which should reach level 9 about 5-10% sooner). The repo is private, so every minute counts against the plan:
# it runs when a PR that changes the game or the bot is labelled `balance` (keeping Classic) or `balance:rebuild`
# (both ways), and on demand (both ways). To run it again after a later push, remove the label and add it back.
# Sessions run the seeds locally, which is free; this is the confirming run for a change the owner will judge.
on:
  pull_request:
    types: [opened, labeled]
    paths:
      - 'src/game/**'
      - 'tools/bot.js'
      - 'tools/run-bot.mjs'
      - 'tools/baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((contains(github.event.pull_request.labels.*.name, 'balance') ||
        contains(github.event.pull_request.labels.*.name, 'balance:rebuild')) &&
       (github.event.action != 'labeled' || startsWith(github.event.label.name, 'balance')))
    # on the job, so another label's skipped run can't cancel a run in progress
    concurrency:
      group: balance-${{ github.event.pull_request.number || github.ref }}-${{ matrix.seed }}-${{ matrix.layouts }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
        layouts: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'balance:rebuild')) && '[false, true]' || '[false]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # the table lands in the run's summary, and a level far off its baseline becomes a warning
      - run: npm run bot -- 1150 '{"layouts":${{ matrix.layouts }}}' --seed ${{ matrix.seed }}
