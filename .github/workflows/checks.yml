name: Checks

# On a draft PR, tools/touched.mjs turns the changed files into the check groups worth running, so most
# rounds while iterating are quick; marking the PR ready for review (ready_for_review, below) re-runs this
# workflow with every group, as does a PR that isn't a draft. A draft's partial run is never the one a merge
# relies on: a draft PR can't be merged, and going ready always re-triggers this workflow with everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR cancels the older run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/touched.mjs diffs against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - id: touched
        if: github.event.pull_request.draft
        run: node tools/touched.mjs origin/main >> "$GITHUB_OUTPUT"
      - name: Run the touched check groups
        if: github.event.pull_request.draft && steps.touched.outputs.groups
        run: for g in ${{ steps.touched.outputs.groups }}; do npm run check -- "$g"; done
      - name: Run every check group
        if: "!(github.event.pull_request.draft && steps.touched.outputs.groups)"
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failures
          path: build/check
          if-no-files-found: ignore
